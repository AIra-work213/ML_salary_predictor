services:
  server:
    build: ./server
    container_name: server_model
    ports:
      - "8000:8000"
    networks:
      - default
  app:
    build: ./app
    container_name: telegram_bot
    depends_on:
      - server
    env_file:
      - .env
    environment:
      - PREDICT_API_URL=http://127.0.0.1:8000/predict
      - TG_PROXY=${TG_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=127.0.0.1,localhost
    network_mode: host

networks:
  default:
    driver: bridge
